name: validate-records
on:
  pull_request:
    paths: ["data/**"]
  push:
    paths: ["data/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate institution records against schema
        run: python scripts/validate_records.py data
